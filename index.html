<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IlArt Kitchen Light</title>

<!-- Подключаем манифест приложения -->
<link rel="manifest" href="manifest.json">
<!-- Задаем цвет статус-бара для iPhone -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
  // Регистрируем Service Worker для работы в офлайне
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('PWA Service Worker успешно зарегистрирован!'))
      .catch(err => console.error('Ошибка PWA:', err));
  }
</script>

    <style>
        :root {
            --bg-color: #0b0c10; --card-bg: #1f2833; --accent: #66fcf1;
            --accent-dim: #45a29e; --text-main: #c5c6c7; --active-gate: #ff9800;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px 15px; 
        }
        .container { max-width: 400px; margin: 0 auto; text-align: center; }
        h1 { font-size: 26px; font-weight: 700; color: #fff; margin: 10px 0 5px; }
        .subtitle { color: var(--accent-dim); font-size: 13px; font-weight: 500; margin-top: 0; text-transform: uppercase; }
        .btn { 
            background: #fff; color: #000; border: none; padding: 14px; font-size: 15px; font-weight: 600; 
            border-radius: 12px; cursor: pointer; margin: 15px 0; width: 100%; 
        }
        .btn:disabled { background: #222; color: #555; }
        .monitor { 
            background: rgba(31, 40, 51, 0.6); backdrop-filter: blur(10px); padding: 15px 20px; 
            border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); 
        }
        .status-badge { font-size: 15px; font-weight: 600; padding: 6px 12px; border-radius: 20px; display: inline-block; margin-bottom: 15px; }
        .present { background: rgba(255, 152, 0, 0.15); color: var(--active-gate); border: 1px solid rgba(255,152,0,0.3); }
        .empty { background: rgba(76, 175, 80, 0.15); color: #4caf50; border: 1px solid rgba(76,175,80,0.3); }
        .metrics { display: flex; justify-content: space-between; }
        .metric-item { flex: 1; text-align: center; }
        .metric-val { font-size: 24px; font-weight: 700; color: #fff; }
        .metric-lbl { font-size: 11px; color: #888; text-transform: uppercase; }
        .fade-box { 
            background: var(--card-bg); padding: 14px 20px; border-radius: 14px; margin-bottom: 20px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .num-input {
            background: #0f1319; color: var(--accent); border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px 12px; width: 60px; border-radius: 8px; text-align: center; font-size: 15px; font-weight: 600;
        }
        .gate-card { 
            background: var(--card-bg); padding: 12px 16px; border-radius: 14px; margin-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.03);
        }
        .gate-card.active-real { border-color: var(--active-gate); }
        .gate-card.active-virtual { border-color: var(--accent); }
        .gate-info { text-align: left; }
        .gate-name { font-size: 14px; font-weight: 600; color: #fff; }
        .gate-range { font-size: 11px; color: #666; margin-top: 1px; }
        .input-wrap { display: flex; flex-direction: column; align-items: flex-end; }
        .input-sub { font-size: 10px; color: #555; margin-top: 2px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>IlArt Kitchen Light</h1>
        <p class="subtitle">Когда лень идти до выключателя</p>
        <!-- Кнопка подключения BLE (уже есть у вас) -->
<button id="connectBtn" class="btn">Подключить по BLE</button>

<!-- НОВАЯ: Скрытая кнопка установки PWA (появится только если установка доступна) -->
<button id="installPwaBtn" class="btn" style="display: none; background: #66fcf1; color: #0b0c10;">УСТАНОВИТЬ КАК ПРИЛОЖЕНИЕ</button>

        <div class="monitor">
            <div id="statusBadge" class="status-badge empty">Ожидание подключения...</div>
            <div class="metrics">
                <div class="metric-item"><div id="liveDist" class="metric-val">---</div><div class="metric-lbl">Расстояние</div></div>
                <div class="metric-item"><div id="liveZone" class="metric-val">---</div><div class="metric-lbl">Вы здесь</div></div>
                <div class="metric-item"><div id="liveLightZone" class="metric-val">---</div><div class="metric-lbl">Свет тут</div></div>
                <div class="metric-item"><div id="livePwm" class="metric-val">---</div><div class="metric-lbl">Яркость</div></div>
            </div>
        </div>
        <div class="fade-box">
            <span>Период перехода между зонами:</span>
            <div style="display: flex; align-items: center; gap: 6px;">
                <input type="number" id="timeInput" min="0.1" max="5.0" step="0.1" class="num-input" value="1.0" onchange="sendTime(this.value)">
                <span style="font-size: 12px; color: #555; font-weight: 600;">СЕК</span>
            </div>
        </div>
        <div id="gatesContainer"></div>
    </div>
    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; 
        const TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; 
        let rxCharacteristic = null;

        const container = document.getElementById('gatesContainer');
        for (let i = 0; i < 7; i++) {
            let isEnv = (i === 6);
            let name = isEnv ? "Зона «Пусто»" : "Зона №" + (i + 1);
            let range = isEnv ? "В помещении никого нет" : (i * 0.5).toFixed(2) + " – " + ((i + 1) * 0.5).toFixed(2) + " м";
            container.innerHTML += `
                <div class="gate-card" id="card_${i}">
                    <div class="gate-info">
                        <div class="gate-name">${name}</div>
                        <div class="gate-range" id="sub_${i}">${range}</div>
                    </div>
                    <div class="input-wrap">
                        <input type="number" id="input_${i}" min="0" max="100" class="num-input" value="0" onchange="sendBright(${i}, this.value)">
                        <div class="input-sub">ЯРКОСТЬ %</div>
                    </div>
                </div>`;
        }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                let bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Kitchen-Radar-Dimm' }], optionalServices: [SERVICE_UUID]
                });
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(RX_UUID);
                const txCharacteristic = await service.getCharacteristic(TX_UUID);
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);
                document.getElementById('statusBadge').innerText = "Синхронизация...";
                document.getElementById('connectBtn').innerText = "Связь активна";
                document.getElementById('connectBtn').disabled = true;
                setTimeout(async () => { await rxCharacteristic.writeValue((new TextEncoder()).encode("GET_CONFIG")); }, 500);
            } catch (error) { alert('BLE Ошибка: ' + error); }
        });

        async function sendBright(zone, valuePercent) {
            let pwmValue = Math.round((valuePercent / 100) * 255);
            if (pwmValue < 0) pwmValue = 0; if (pwmValue > 255) pwmValue = 255;
            if (!rxCharacteristic) return;
            let key = zone === 6 ? "E" : zone;
            await rxCharacteristic.writeValue((new TextEncoder()).encode("Z" + key + ":" + pwmValue));
        }

        async function sendTime(value) {
            if (!rxCharacteristic) return;
            await rxCharacteristic.writeValue((new TextEncoder()).encode("T:" + value));
        }

        function handleNotifications(event) {
            let str = (new TextDecoder()).decode(event.target.value);
            if (str.startsWith("CONFIG:")) {
                let parts = str.split(':');
                for(let i=0; i<7; i++) {
                    let pwm = parseInt(parts[i+1]);
                    document.getElementById("input_" + i).value = Math.round((pwm / 255) * 100);
                }
                document.getElementById('timeInput').value = parseFloat(parts[8]);
                document.getElementById('statusBadge').innerText = "Контроллер готов";
                return;
            }
            if (str.startsWith("DATA:")) {
                let parts = str.split(':');
                let present = (parts[1] === "1");
                let distance = parseInt(parts[2]);
                let realZ = parseInt(parts[3]);
                let virtZ = parseInt(parts[4]);
                let pwm = parseInt(parts[5]);

                const badge = document.getElementById('statusBadge');
                if (present) {
                    badge.className = "status-badge present"; badge.innerText = "Объект в зоне";
                    document.getElementById('liveDist').innerText = distance + " см";
                    document.getElementById('liveZone').innerText = "Зона " + (realZ + 1);
                } else {
                    badge.className = "status-badge empty"; badge.innerText = "Кухня пуста";
                    document.getElementById('liveDist').innerText = "---";
                    document.getElementById('liveZone').innerText = "Пусто";
                }
                document.getElementById('liveLightZone').innerText = (virtZ === 6) ? "Пусто" : "Зона " + (virtZ + 1);
                document.getElementById('livePwm').innerText = Math.round((pwm / 255) * 100) + "%";

                for (let i = 0; i < 7; i++) {
                    const card = document.getElementById("card_" + i);
                    const sub = document.getElementById("sub_" + i);
                    card.classList.remove('active-real', 'active-virtual');
                    if (present && i === realZ) card.classList.add('active-real');
                    if (i === virtZ) card.classList.add('active-virtual');
                    
                    if (present && i === realZ && i === virtZ) {
                        sub.innerHTML = '<span style="color:var(--active-gate); font-weight:600;">Вы здесь 📍 и свет тут 💡</span>';
                    } else if (present && i === realZ) {
                        sub.innerHTML = '<span style="color:var(--active-gate); font-weight:600;">Вы здесь 📍</span>';
                    } else if (i === virtZ) {
                        sub.innerHTML = '<span style="color:var(--accent); font-weight:600;">Свет тут 💡</span>';
                    } else {
                        sub.innerText = (i === 6) ? "В помещении никого нет" : (i * 0.5).toFixed(2) + " – " + ((i + 1) * 0.5).toFixed(2) + " м";
                    }
                }
            }
        }
    
    let deferredPrompt;
const installBtn = document.getElementById('installPwaBtn');

window.addEventListener('beforeinstallprompt', (e) => {
    // Предотвращаем автоматическое появление системного окна Chrome
    e.preventDefault();
    // Сохраняем событие, чтобы вызвать его по кнопке
    deferredPrompt = e;
    // Показываем нашу красивую хайтек-кнопку на экране
    installBtn.style.display = 'block';
});

async function installApp() {
    if (!deferredPrompt) return;
    // Показываем системное окно установки Android
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log(`Результат установки: ${outcome}`);
    // Очищаем переменную, кнопка больше не нужна
    deferredPrompt = null;
    installBtn.style.display = 'none';
}

// Привязываем клик к нашей кнопке
installBtn.addEventListener('click', installApp);

    // Обязательный блок регистрации Service Worker для активации кнопки "Установить" в Chrome
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('PWA успешно активирован!'))
            .catch(err => console.log('Ошибка активации PWA:', err));
    });
}

    
    </script>
</body>
</html>
